# Version updates: monthly, one grouped PR per ecosystem (at most ~3 PRs/month).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    groups:
      nuget: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /src/Agentd.Web
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions: { patterns: ["*"] }
