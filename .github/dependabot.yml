# Version updates: monthly, one grouped PR per ecosystem (at most ~3 PRs/month).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: monthly }
    groups:
      nuget: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /src/Agentd.Web
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (and openapi-typescript is overridden to our version):
      # a TypeScript major breaks `npm ci`. Lift this when typescript-eslint supports the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions: { patterns: ["*"] }
