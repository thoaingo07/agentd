name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Agentd.slnx

      - name: Format
        run: dotnet format Agentd.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Agentd.slnx --no-restore -c Release

      # MSTest on Microsoft.Testing.Platform: dotnet test runs in MTP mode (global.json "test.runner").
      # Integration tests use Testcontainers with the runner's Docker; Aspire (AppHost) tests are excluded.
      - name: Test
        run: >-
          dotnet test --solution Agentd.slnx --no-build -c Release
          --filter "TestCategory!=Aspire"
          --report-trx --results-directory TestResults
          --coverage --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Agentd.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/Agentd.Web/package-lock.json

      - run: npm ci

      # openapi.json is checked against the server by Bff.Tests; schema.d.ts must match openapi.json.
      - name: API types match the BFF contract
        run: |
          npm run gen:api
          git diff --exit-code ClientApps/shared/api/schema.d.ts || { echo "::error::run \`npm run gen:api\` in src/Agentd.Web and commit"; exit 1; }

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

      - name: Vite manifest produced (ViteHelper reads it)
        run: test -f wwwroot/manifest.json
