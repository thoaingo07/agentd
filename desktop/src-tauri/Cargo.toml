[package]
name = "agentd-desktop"
version = "0.1.0"
description = "A desktop window on your agentd servers"
edition = "2021"
publish = false

[lib]
name = "agentd_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-opener = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
